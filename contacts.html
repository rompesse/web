<!DOCTYPE html>
<html lang="uk">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initital-scale=1.0"/>
        <meta name="description" content="Можливість залишення зворотнього звʼязку."/>
        <title>Лабораторна 2 - Контакти</title>
        <link rel="icon" href="assets/images/favicon-16x16.png"/>
        <link rel="stylesheet" href="styles.css"/>
    </head>
    <body>
        <a class="skip-link" href="#main">Перейти до основного контенту</a>

        <header class="header">
            <h1 id="header__title">Мій перший лендінг</h1>
            <nav class="navigation" aria-label="Головна навігація">
                <ul class="navigation__list">
                    <li class="navigation__item"><a class="navigation__link" href="index.html" aria-current="page">Головна</a></li>
                    <li class="navigation__item"><a class="navigation__link" href="about.html">Про нас</a></li>
                    <li class="navigation__item"><a class="navigation__link" href="contacts.html">Контакти</a></li>
                </ul>
            </nav>
        </header>
        
        <main id="main">
            <h2 class="main__title">Звʼяжіться з нами</h2>

            <form class="contact-form" action="#" method="post">
                <div class="contact-form__item">
                    <label for="name" class="contact-form__label">Імʼя</label>
                    <input type="text" id="name" name="name" class="contact-form__input" required placeholder="Ваше імʼя">
                </div>
                <div class="contact-form__item">
                    <label for="email" class="contact-form__label">Email</label>
                    <input type="email" id="email" name="email" class="contact-form__input" required placeholder="Ваш email">
                </div>
                <div class="contact-form__item">
                    <label for="msg" class="contact-form__label">Повідомлення</label>
                    <textarea id="msg" name="msg" class="contact-form__textarea" placeholder="Ваше повідомлення"></textarea>
                </div>
                <button type="submit" class="contact-form__button">Надіслати</button>
            </form>
        </main>

        <aside class="sidebar sidebar--social" aria-label="Додаткова інформація">
            <h3 class="sidebar__title">Соціальні мережі</h3>
            <ul class="sidebar__list">
                <li class="sidebar__item"><a href="#" aria-label="Ми у Facebook" class="sidebar__link">Facebook</a></li>
                <li class="sidebar__item"><a href="#" aria-label="Ми у Instagram" class="sidebar__link">Instagram</a></li>
                <li class="sidebar__item"><a href="#" aria-label="Ми у LinkedIn" class="sidebar__link">LinkedIn</a></li>
            </ul>
        </aside>

        <footer class="footer">
            <p class="footer__text">©️ 2026 6.1214-пі-2</p>
        </footer>
    </body>
</html>
